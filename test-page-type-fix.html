<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面类型识别修复测试</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-case { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-case h3 { margin-top: 0; color: #333; }
        .result { font-weight: bold; padding: 5px; border-radius: 3px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>页面类型识别修复测试</h1>
    <p>测试修复后的页面类型识别逻辑，确保只有文章页检查 topics 元素。</p>
    
    <div id="test-results"></div>
    
    <script>
        // 复制修复后的 getPageType 函数
        function getPageType(url, urlParts) {
            // 检查特殊页面标识（优先级最高）
            if ($('#bookListFlg').length) {
                return 'books';
            }
            
            if ($('#linkListFlg').length) {
                return 'links';
            }
            
            // 根据URL路径判断页面类型
            // 标签页: /tag/标签名/
            if (url.includes('/tag/') && urlParts[4] === 'tag') {
                return 'tag';
            }
            
            // 随笔分类页: /category/分类ID.html
            if (url.includes('/category/') && urlParts[4] === 'category') {
                return 'category';
            }
            
            // 随笔档案页: /p/archive/年份/月份
            if (url.includes('/p/archive/') && urlParts[4] === 'p' && urlParts[5] === 'archive') {
                return 'archive';
            }
            
            // 相册页: /gallery/image/图片ID.html
            if (url.includes('/gallery/') && urlParts[4] === 'gallery') {
                return 'gallery';
            }
            
            // 文章页: /p/文章ID（只有文章页才有topics元素）
            if (urlParts[4] === 'p' && urlParts[5] && !urlParts[5].includes('archive')) {
                // 进一步验证是否有topics元素
                if ($('#topics').length) {
                    return 'article';
                }
            }
            
            // 默认返回首页（当没有匹配到其他页面类型时）
            return 'home';
        }
        
        // 测试用例
        const testCases = [
            {
                name: '首页（无特殊元素）',
                url: 'https://www.cnblogs.com/username/',
                elements: [],
                expected: 'home'
            },
            {
                name: '文章页（有topics元素）',
                url: 'https://www.cnblogs.com/username/p/12345678.html',
                elements: ['topics'],
                expected: 'article'
            },
            {
                name: '文章页URL但无topics元素（应返回首页）',
                url: 'https://www.cnblogs.com/username/p/12345678.html',
                elements: [],
                expected: 'home'
            },
            {
                name: '标签页（无topics元素）',
                url: 'https://www.cnblogs.com/username/tag/javascript/',
                elements: [],
                expected: 'tag'
            },
            {
                name: '分类页（无topics元素）',
                url: 'https://www.cnblogs.com/username/category/123456.html',
                elements: [],
                expected: 'category'
            },
            {
                name: '档案页（无topics元素）',
                url: 'https://www.cnblogs.com/username/p/archive/2024/01',
                elements: [],
                expected: 'archive'
            },
            {
                name: '相册页（无topics元素）',
                url: 'https://www.cnblogs.com/username/gallery/image/123.html',
                elements: [],
                expected: 'gallery'
            },
            {
                name: '书单页',
                url: 'https://www.cnblogs.com/username/books/',
                elements: ['bookListFlg'],
                expected: 'books'
            },
            {
                name: '友链页',
                url: 'https://www.cnblogs.com/username/links/',
                elements: ['linkListFlg'],
                expected: 'links'
            }
        ];
        
        function runTests() {
            let results = '<table><tr><th>测试用例</th><th>URL</th><th>DOM元素</th><th>预期结果</th><th>实际结果</th><th>状态</th></tr>';
            let passCount = 0;
            
            testCases.forEach((testCase, index) => {
                // 清理之前的测试元素
                $('#topics, #bookListFlg, #linkListFlg').remove();
                
                // 添加测试所需的DOM元素
                testCase.elements.forEach(elementId => {
                    $('body').append(`<div id="${elementId}" style="display:none;"></div>`);
                });
                
                // 解析URL
                const urlParts = testCase.url.split('/');
                
                // 执行测试
                const result = getPageType(testCase.url, urlParts);
                const isPass = result === testCase.expected;
                
                if (isPass) passCount++;
                
                results += `<tr>
                    <td>${testCase.name}</td>
                    <td>${testCase.url}</td>
                    <td>${testCase.elements.join(', ') || '无'}</td>
                    <td>${testCase.expected}</td>
                    <td>${result}</td>
                    <td class="${isPass ? 'success' : 'error'}">${isPass ? '✓ 通过' : '✗ 失败'}</td>
                </tr>`;
                
                // 清理测试元素
                testCase.elements.forEach(elementId => {
                    $(`#${elementId}`).remove();
                });
            });
            
            results += '</table>';
            
            const summary = `<div class="test-case">
                <h3>测试总结</h3>
                <p>总测试用例: ${testCases.length}</p>
                <p>通过: <span class="success">${passCount}</span></p>
                <p>失败: <span class="${testCases.length - passCount > 0 ? 'error' : 'success'}">${testCases.length - passCount}</span></p>
                <p>通过率: ${((passCount / testCases.length) * 100).toFixed(1)}%</p>
            </div>`;
            
            $('#test-results').html(summary + results);
        }
        
        // 页面加载完成后运行测试
        $(document).ready(function() {
            runTests();
        });
    </script>
</body>
</html>
